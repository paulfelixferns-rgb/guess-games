<!DOCTYPE html>
<html>
<head>
    <title>My Games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            text-align: center;
            padding: 40px;
        }
        h1 {
            color: #1f2937;
        }
        .games {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 350px;
            margin: 40px auto;
        }
        a {
            display: block;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 12px;
        }
        .guess {
            background: #2563eb;
        }
        .tictactoe {
            background: #16a34a;
        }
    </style>
</head>
<body>
    <h1>My Games</h1>
    <p>Select a game to play</p>

    <div class="games">
        <a class="guess" href="/guess">Guess the Number</a>
        <a class="tictactoe" href="/tic-tac-toe">Tic Tac Toe</a>
    </div>
</body>
</html>
